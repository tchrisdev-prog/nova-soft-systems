# Nova Sync Systems en Docker.
#
#   cp .env.docker.example .env     (y completa los valores marcados)
#   docker compose up -d --build
#   → http://localhost:8080
#
# Servicios:
#   web        nginx: sirve la interfaz y reenvía la API a PHP-FPM (único puerto publicado)
#   app        Laravel en PHP-FPM; al arrancar migra y sincroniza permisos
#   scheduler  Programador de tareas (abre cada mes de las mensualidades)
#   db         PostgreSQL 16 con sus datos en un volumen
#
# Los secretos salen del archivo .env de esta carpeta, que nunca se sube al
# repositorio. Si falta uno obligatorio, Compose se detiene y lo dice.

name: nova-sync

x-backend-env: &backend-env
  APP_NAME: "Nova Sync Systems"
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_KEY: ${APP_KEY:-}
  APP_URL: ${APP_URL:-http://localhost:8080}
  FRONTEND_URL: ${APP_URL:-http://localhost:8080}
  APP_LOCALE: es
  APP_FALLBACK_LOCALE: en
  APP_TIMEZONE: UTC
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-info}

  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-nova_sync}
  DB_USERNAME: ${DB_USERNAME:-nova}
  DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}

  SESSION_DRIVER: database
  SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
  SESSION_ENCRYPT: "true"
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
  SESSION_SAME_SITE: lax
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:8080,127.0.0.1:8080}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  CACHE_STORE: database
  QUEUE_CONNECTION: database

  MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
  MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
  MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
  MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-http://localhost:8080/auth/microsoft/callback}

  NOVA_AUTO_PROVISION_USERS: ${NOVA_AUTO_PROVISION_USERS:-false}
  NOVA_ALLOWED_EMAIL_DOMAINS: ${NOVA_ALLOWED_EMAIL_DOMAINS:-}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-nova_sync}
      POSTGRES_USER: ${DB_USERNAME:-nova}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    # Sin puertos publicados: solo la aplicación llega a la base de datos.
    # Para revisarla desde tu equipo, descomenta (queda solo en localhost):
    # ports:
    #   - "127.0.0.1:5432:5432"

  app:
    build:
      context: ./backend
    image: nova-sync/backend:local
    restart: unless-stopped
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "true"
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    image: nova-sync/backend:local
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment:
      <<: *backend-env
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      disable: true

  web:
    build:
      context: ./frontend
    image: nova-sync/web:local
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  storage:
