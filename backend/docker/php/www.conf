; Pool de PHP-FPM. Escucha en el puerto 9000 de la red interna de Docker:
; solo el contenedor web (nginx) le habla; nunca se publica hacia afuera.
[www]
listen = 9000
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Para el healthcheck (responde "pong").
ping.path = /ping
ping.response = pong

; Las variables del contenedor (APP_KEY, DB_*, MICROSOFT_*...) llegan a Laravel.
clear_env = no

; Registros de acceso fuera: nginx ya los lleva.
access.log = /dev/null
catch_workers_output = yes
decorate_workers_output = no
