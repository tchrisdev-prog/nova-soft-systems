; Ajustes de PHP para producción. No se muestran errores al usuario: van al
; registro del contenedor (docker compose logs app).
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 12M
max_execution_time = 60
date.timezone = UTC

; La cookie de sesión la maneja Laravel; esto solo endurece la de PHP.
session.cookie_httponly = On
session.use_strict_mode = On

; OPcache: el código no cambia dentro del contenedor, así que no se revisan
; las fechas de los archivos en cada petición.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
