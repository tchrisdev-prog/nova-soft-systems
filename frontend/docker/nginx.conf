# Nova Sync Systems: interfaz (archivos estáticos) + API Laravel por FastCGI.
#
# Este archivo es una plantilla: al arrancar, la imagen de nginx reemplaza
# ${PHP_UPSTREAM} por el valor de la variable de entorno. Las variables
# propias de nginx ($uri, $host...) no se tocan.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    client_max_body_size 12m;
    charset utf-8;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Cabeceras de seguridad para todas las respuestas. Las ubicaciones de
    # abajo no usan add_header, porque en nginx eso anularía estas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Solo código y recursos propios. 'unsafe-inline' en estilos es por los
    # atributos style de React (anchos de barras); no hay scripts en línea.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Para el healthcheck del contenedor.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API, flujo de Microsoft 365, cookie CSRF de Sanctum y salud de Laravel:
    # todo lo atiende public/index.php dentro del contenedor del backend.
    location ~ ^/(api|auth|sanctum)(/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        # Protección contra "httpoxy": nunca se reenvía una cabecera Proxy.
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 60s;
        fastcgi_pass ${PHP_UPSTREAM};
    }

    location = /up {
        access_log off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass ${PHP_UPSTREAM};
    }

    # Archivos con huella en el nombre (Vite): se pueden guardar un año.
    location /assets/ {
        expires max;
        access_log off;
        try_files $uri =404;
    }

    # Nada de archivos ocultos (.env, .git...), aunque no deberían estar aquí.
    location ~ /\. {
        deny all;
    }

    # La SPA: cualquier ruta que no sea un archivo la resuelve React Router.
    # index.html nunca se guarda en caché para que una versión nueva se vea
    # de inmediato.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        expires -1;
    }
}
